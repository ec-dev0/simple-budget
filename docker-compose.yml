services:
  simple-budget:
    build: .
    # Si defines GHCR_IMAGE en el entorno, también se etiqueta con ese tag
    image: ${GHCR_IMAGE:-simple-budget:latest}
    container_name: simple-budget
    mem_limit: 512m
    cpus: "0.50"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/budget.db
    volumes:
      - budget-data:/app/data
    restart: unless-stopped

volumes:
  budget-data:
